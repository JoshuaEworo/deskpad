name: Publish tested desktop release
on:
  workflow_run:
    workflows: [Windows build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful main-branch Windows build run ID
        required: true
        default: '40758138973'
      release_tag:
        description: Version tag matching that build
        required: true
        default: v0.2.0-alpha.4
permissions:
  contents: read
concurrency:
  group: desktop-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate source build and checks
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg repo "$REPO" '.name == "Windows build" and .path == ".github/workflows/windows-build.yml" and .head_repository.full_name == $repo and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"' run.json
          source_sha=$(jq -r .head_sha run.json)
          gh api "repos/$REPO/actions/runs?head_sha=$source_sha&event=push&per_page=100" > checks.json
          jq -e '.workflow_runs | any(.name == "Checks" and .status == "completed" and .conclusion == "success")' checks.json
          current_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$source_sha" != "$current_sha" ]]; then
            echo 'A newer main commit is being built; leave publication to that build.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.source.outputs.eligible == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Resolve new version
        if: steps.source.outputs.eligible == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(python -c 'import ast,pathlib; tree=ast.parse(pathlib.Path("host/deskpad/updates.py").read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="VERSION" for t in n.targets)))')"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$tag" ]]; then
            echo 'Requested tag differs from the tested source version.' >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version already published; no release needed."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.version.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -c requirements.lock
        if: steps.version.outputs.publish == 'true'
      - name: Refuse update channel downgrade
        if: steps.version.outputs.publish == 'true'
        run: |
          python - <<'PYCODE'
          from deskpad.updates import VERSION, check_update
          if check_update() is not None:
              raise SystemExit("A newer signed release already exists. Refusing a channel downgrade.")
          print("No newer signed release; publication allowed:", VERSION)
          PYCODE
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: Deskpad-Windows-x64
          path: release
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Sign update metadata
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DESKPAD_UPDATE_SIGNING_KEY: ${{ secrets.DESKPAD_UPDATE_SIGNING_KEY }}
        run: python scripts/sign_update.py
      - name: Publish release and channel
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-alpha.* ]]; then flags+=(--prerelease); fi
          # Refuse to overwrite an existing version: each release is immutable by policy.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version is already published. Publish a new version instead.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/Deskpad-Setup-Windows-x64.exe release/Deskpad-Windows-x64.zip release/update.json --target "$SOURCE_SHA" --title "Deskpad $RELEASE_TAG" --notes-file RELEASE-NOTES.md "${flags[@]}"
          if ! gh release view update-channel >/dev/null 2>&1; then
            gh release create update-channel --target "$SOURCE_SHA" --prerelease --title "Deskpad update channel" --notes "Signed desktop update metadata. Download installers from versioned releases."
          fi
          gh release upload update-channel release/update.json --clobber
