[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpad"
version = "0.1.0a1"
description = "Your desktop above. Your controls below."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pillow>=11,<13", "mss>=10,<11", "qrcode>=8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
deskpad = "deskpad.cli:main"

[tool.setuptools]
package-dir = {"" = "host"}

[tool.setuptools.packages.find]
where = ["host"]
include = ["deskpad*"]

[tool.setuptools.package-data]
deskpad = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["host/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
