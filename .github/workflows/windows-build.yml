name: Windows build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pip install -e ".[dev,desktop,media]" -c requirements.lock pyinstaller
      - run: python -m pytest -q
      - name: Bundle hosted origin
        env:
          DESKPAD_SERVICE_URL: ${{ vars.DESKPAD_SERVICE_URL }}
        run: python -c "import json,os,pathlib; from deskpad.settings import Settings; path=pathlib.Path('host/deskpad/deployment.json'); bundled=json.loads(path.read_text()); value=Settings(service_url=os.environ.get('DESKPAD_SERVICE_URL') or bundled.get('service_url','')); path.write_text(json.dumps({'service_url':value.service_url}))"
      - run: python scripts/build_icon.py
      - run: python -m PyInstaller --noconfirm --windowed --icon build/deskpad.ico --name Deskpad --collect-submodules uvicorn --collect-submodules mss --collect-submodules websockets --collect-submodules aiortc --collect-submodules av --collect-submodules soundcard --collect-submodules sounddevice --collect-submodules pyvirtualcam --collect-submodules dxcam --add-data "host/deskpad/static:deskpad/static" --add-data "host/deskpad/deployment.json:deskpad" --add-data "host/deskpad/update-key.json:deskpad" scripts/desktop_entry.py
      - name: Smoke test desktop startup and shutdown
        run: |
          & .\dist\Deskpad\Deskpad.exe --demo --screenshot "$env:RUNNER_TEMP\deskpad-desktop.png" | Out-Null
          if (-not (Test-Path "$env:RUNNER_TEMP\deskpad-desktop.png")) { throw "Desktop smoke test did not render a window." }
      - run: python scripts/collect_notices.py
      - run: Copy-Item README.md,LICENSE,SECURITY.md,THIRD-PARTY-NOTICES.md dist/Deskpad/
      - run: Compress-Archive -Path dist/Deskpad -DestinationPath dist/Deskpad-Windows-x64.zip
      - name: Create per-user installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/installer.iss'
      - name: Test installed update handoff and persistence
        run: python scripts/test_installer_upgrade.py
      - uses: actions/upload-artifact@v4
        with:
          name: Deskpad-Windows-x64
          path: |
            dist/Deskpad-Windows-x64.zip
            dist/Deskpad-Setup-Windows-x64.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -c requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: Deskpad-Windows-x64
          path: release
      - name: Sign update metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DESKPAD_UPDATE_SIGNING_KEY: ${{ secrets.DESKPAD_UPDATE_SIGNING_KEY }}
        run: python scripts/sign_update.py
      - name: Publish version and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_TAG" == *-alpha.* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/Deskpad-Setup-Windows-x64.exe release/Deskpad-Windows-x64.zip release/update.json --verify-tag --title "Deskpad $RELEASE_TAG" --notes-file RELEASE-NOTES.md "${release_flags[@]}"
          if ! gh release view update-channel >/dev/null 2>&1; then
            gh release create update-channel --target "$GITHUB_SHA" --prerelease --title "Deskpad update channel" --notes "Signed update metadata for the desktop app. Download installers from versioned releases."
          fi
          gh release upload update-channel release/update.json --clobber
